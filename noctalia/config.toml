[nightlight]
enabled = true

[osd]
position = "bottom_center"
position_vertical = "bottom_center"

[plugins]
auto_update = "all"
enabled = [
    "0lucasmatheus/awwwall",
    "aristides/udiskie",
    "nightwatch75/topgrade-wrapper",
    "rylos/syncthing",
    "alexander/screen-toolkit",
    "icefish/phone-connect",
    "icefish/phone-operate",
    "davemhammer/tailscale"
]

[shell]
button_borders = false
external_ip_enabled = true
font_family = "JetBrainsMono Nerd Font Propo"
input_borders = false
popup_borders = false
settings_expand_all_groups = true

    [shell.launcher]
    default_view = "all"

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.panels]
        global = false

    [shell.screen_corners]
    enabled = true
    size = 100

[theme]
builtin = "Ayu"
community_palette = "ADW"
custom_palette = "by8l7py4e0dg1-mc"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "kcolorscheme", "niri", "qt" ]
    community_ids = [ "opencode", "vicinae" ]

[wallpaper]
directory = "/home/rambeau/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/rambeau/Pictures/Wallpapers/japanStreet.png"

    [wallpaper.last]
    path = "/home/rambeau/Pictures/Wallpapers/japanStreet.png"

    [wallpaper.monitors.DP-3]
    path = "/home/rambeau/Pictures/Wallpapers/japanStreet.png"

[widget.audio_visualizer]
bands = 10
capsule = false
interactive = false
mirrored = false
reversed = true
scale = 1.1500000000000001
width = 70

[widget.bar]
type = "raycursive/niri-displays:bar"

[widget.bar_2]
type = "icefish/phone-connect:bar"

[widget.bar_3]
type = "rylos/syncthing:bar"

[widget.brightness]
font_scale = 0.96000000000000008

[widget.clock]
format = "{:%H:%M | %a %b %d} |"

[widget.media]
art_size = 18
capsule = false
hide_artist = true
hide_when_idle = true
hide_when_no_media = true
interactive = false
max_length = 140
rotate_album_art = true
show_progress = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.nextboot-selector]
type = "avivbintangaringga/nextboot-selector:nextboot-selector"

[widget.notifications]
capsule = true
capsule_radius = "auto"

[widget.rules]
type = "setyvii/niri-rules-studio:rules"

[widget.status]
type = "aristides/udiskie:status"

[widget.status_2]
type = "davemhammer/tailscale:status"

[widget.status_3]
type = "icefish/phone-operate:status"

[widget.taskbar]
anchor = true
capsule = true
capsule_border_width = 0.0
capsule_opacity = 0.0
capsule_padding = 0
capsule_radius = 4
group_by_workspace = true
hide_empty_workspaces = true
icon_scale = 1.2000000000000002
inactive_opacity = 0.55000000000000004
show_active_indicator = false
show_workspace_label = false
workspace_group_active_border_color = "secondary"
workspace_group_inactive_border_color = "on_secondary"
workspace_label_placement = "inside"

[widget.toggle]
type = "0lucasmatheus/awwwall:toggle"

[widget.topgrade-wrapper]
type = "nightwatch75/topgrade-wrapper:topgrade-wrapper"

[widget.tray]
capsule = true
capsule_radius = "auto"
drawer = true

[widget.volume]
show_label = false

[widget.weather]
show_condition = false

[widget.widget]
type = "alexander/screen-toolkit:widget"

[widget.workspaces]
anchor = true
hide_when_empty = true
label_source = "name"
labels_only_when_occupied = true
pill_scale = 0.90000000000000002
style = "focus_hint"
